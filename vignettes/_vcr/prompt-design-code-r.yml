        data has `NA`s, pass `na.rm = TRUE` using a lambda:\n\n```r\ndf |>\n  group_by(age,
        sex) |>\n  summarise(\n    across(\n      a:z,\n      list(\n        mean   =
        \\(x) mean(x, na.rm = TRUE),\n        median = \\(x) median(x, na.rm = TRUE)\n      )\n    ),\n    .groups
        = \"drop\"\n  )\n```\n\n**Selecting columns.** `a:z` selects every column
        positioned between `a` and `z`. If the columns aren''t contiguous, or `age`
