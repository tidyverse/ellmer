        2002-05-16\n\nDirector: George Lucas\n\nThere is unrest in the Galactic Senate.
        Several thousand solar systems have declared their intentions to leave the
        Republic.\n\nThis separatist movement, under the leadership of the mysterious
        Count Dooku, has made it difficult for the limited number of Jedi Knights
        to maintain peace and order in the galaxy.\n\nSenator Amidala, the former
        Queen of Naboo, is returning to the Galactic Senate to vote on the critical
        issue of creating an ARMY OF THE REPUBLIC to assist the overwhelmed Jedi….\n\n##
        Revenge of the Sith\n\nReleased: 2005-05-19\n\nDirector: George Lucas\n\nWar!
