                  "text": "- **Relationship:** A tibble is a modern type of R data frame provided by the **tibble** package. It inherits from `data.frame`, so most data-frame functions work with it.\n- **Printing:** Tibbles display a preview of rows and columns, along with column types. Data frames typically print more of their contents.\n- **Subsetting:** `[` always returns a tibble, even when selecting one column. A data frame may simplify the result to a vector.\n- **Column names:** Tibbles preserve nonstandard names, such as names containing spaces. Data frames normally adjust them by default.\n- **Column access:** Tibbles do not support partial matching with `$` and warn when a column does not exist. Data frames can partially match names and return `NULL` for missing columns.\n- **Recycling:** Tibbles recycle only length-one inputs when creating columns; data frames allow more permissive recycling."
