                  "text": "- A **data frame** is the traditional tabular data structure in base R. A **tibble** is a modern, enhanced version of a data frame provided by the **tibble** package (part of the tidyverse).\n\n- Tibbles print more compactly:\n  - They show only the first few rows and columns by default.\n  - They display column types and avoid flooding the console with large datasets.\n  - Base data frames often print all rows unless limited manually.\n\n- Tibbles do not automatically convert character columns to factors.  \n  - Older versions of `data.frame()` converted strings to factors by default (though modern R defaults no longer do this).\n\n- Tibbles preserve column names more strictly:\n  - They allow non-syntactic names such as `\"total cost\"` without automatically changing them.\n  - Base data frames may modify invalid names unless `check.names = FALSE` is used.\n\n- Tibbles are stricter when subsetting:\n  - Extracting a single column with `tibble[, \"x\"]` returns a one-column tibble.\n  - With a base data frame, `df[, \"x\"]` usually returns a vector unless `drop = FALSE` is specified.\n\n- Tibbles do not partially match column names, reducing the chance of accidental mistakes:\n  - `tb$long` will not silently match a column named `long_name`.\n  - Base data frames may allow partial matching in some situations.\n\n- Tibbles support list-columns naturally, making them especially useful in tidyverse workflows and nested data analysis.\n\n- Both store rectangular data with rows and columns, and most functions that work with data frames also work with tibbles."
                }
